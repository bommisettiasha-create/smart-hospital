<!DOCTYPE html>
<html>
<head>
<title>Smart Hospital - Asha Project</title>
<style>
body { font-family: Arial; background: #f0f8ff; padding: 20px; }
.card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
h1 { color: #0077cc; text-align: center; }
input { padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid #ccc; width: 22%; }
button { padding: 10px 20px; background: #0077cc; color: white; border: none; border-radius: 8px; cursor: pointer; }
button:hover { background: #005fa3; }
table { width: 100%; margin-top: 20px; border-collapse: collapse; }
th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
th { background: #0077cc; color: white; }
</style>
</head>
<body>
<div class="card">
<h1>🏥 Smart Hospital - Patient Management</h1>
<h3>Add Patient</h3>
<input id="name" placeholder="Name">
<input id="age" type="number" placeholder="Age">
<input id="disease" placeholder="Disease">
<input id="phone" placeholder="Phone">
<button onclick="addPatient()">Add</button>

<h3>Patients List</h3>
<button onclick="loadPatients()">🔄 Refresh List</button>
<table id="table">
<tr><th>ID</th><th>Name</th><th>Age</th><th>Disease</th><th>Phone</th></tr>
</table>
<p style="text-align:center; color: gray;">Made by Asha ❤️</p>
</div>

<script>
async function loadPatients(){
 let res = await fetch('/patients');
 let data = await res.json();
 let table = document.getElementById('table');
 table.innerHTML = "<tr><th>ID</th><th>Name</th><th>Age</th><th>Disease</th><th>Phone</th></tr>";
 data.forEach(p => {
   table.innerHTML += `<tr><td>${p.id}</td><td>${p.name}</td><td>${p.age}</td><td>${p.disease}</td><td>${p.phone||''}</td></tr>`;
 });
}
async function addPatient(){
 let body = {
   name: document.getElementById('name').value,
   age: parseInt(document.getElementById('age').value),
   disease: document.getElementById('disease').value,
   phone: document.getElementById('phone').value
 };
 await fetch('/patients', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
 alert('Patient Added!');
 loadPatients();
}
loadPatients();
</script>
</body>
</html>
